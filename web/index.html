<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

			content="Queue photos into Flickr groups and wait out the daily limits."

		<!-- Required by `font-display: optional`, not an optimization beside it. Remove

			rel="preload"
			href="/fonts/inter-var-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
	</head>

	</body>
