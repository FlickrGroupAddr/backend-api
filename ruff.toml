# Ruff, the Python half of this repository's gate. Biome does the same job for
# TypeScript, and this file exists so the two are equally serious.
#
# **Widened from ANN-only on 2026-08-17.** Terry: *"I'm feeling like I left money
# on the table. We installed and used Biome for full TS linting, but I think I
# told you to ONLY use the Python linter for type hint checks ... turn on the
# highest sane level of pedantry ... Don't overkill it, just what is best
# practice."*
#
# **INTEGRATE BEFORE INNOVATE.** A hand-rolled AST checker was written first and
# deleted. npm's `ruff` is an UNRELATED IMPOSTOR package -- see CLAUDE.md.
#
#     python -m ruff check scripts/         # via `npm run typehints`
#
# **Every selection below was chosen from a measurement, not from a list.**
# `--select ALL` was run against this repository first, and each family was kept
# or dropped on what it actually reported here.

target-version = "py313"
line-length = 100

[lint]
# **BUGS FIRST.** These are the families that reported real defects on the first
# run: `F821` found an undefined name in a live hook, `B023` found three closures
# capturing a loop variable, `ARG002` found a parameter nothing reads.
select = [
    "F",     # pyflakes -- undefined names, unused imports. Never optional
    "E", "W",# pycodestyle
    "I",     # import sorting
    "N",     # PEP 8 naming
    "UP",    # pyupgrade -- modern syntax for the pinned target-version
    "B",     # bugbear -- the highest-yield bug family here
    "A",     # shadowed builtins
    "C4",    # comprehensions
    "SIM",   # simplifications that read better
    "RET",   # return-statement hygiene
    "ARG",   # unused arguments
    "PIE",   # miscellaneous correctness
    "PERF",  # obvious performance mistakes
    "RUF",   # ruff's own
    "ANN",   # THE STANDING ORDER: every signature fully type hinted
    "DTZ",   # naive datetimes
    "ISC",   # implicit string concatenation
    "FURB",  # modernization
    "TID",   # tidy imports
    "SLF",   # private member access
]

# **Each of these was measured and refused. The count is what it reported here.**
# A checker that cries wolf gets switched off -- the argument
# `scripts/claude-dirty-words.py` already makes about keeping its word list
# explicit. **Adding a family back is a decision, not a tidy-up.**
#
#   T20   112  `print` IS the interface. Every file here is a CLI tool or a hook
#   D      55  Docstrings here are house-styled essays, not PEP 257 one-liners
#   PTH   154  See the note below -- deferred with a reason, not refused
#   EM/TRY 32  Wants a custom exception class per raise. No defect caught
#   PLR2004 13 Magic values, in scripts whose whole job is numeric layout
#   PLC0415 8  Imports inside functions are DELIBERATE here, for hook startup time
#   S      11  Bandit flags subprocess and ElementTree, which are the job
#   FBT     9  Boolean-trap is a design opinion, not a defect
#   CPY    11  No copyright headers in a personal repository
#   INP     7  Wants __init__.py in a directory of standalone scripts
#   C901/PLR0912  Complexity thresholds would force a refactor of working code
ignore = [
    # The formatter owns these, and ruff itself warns that they fight it.
    "COM812", "ISC001",
    # The house style uses em dashes and curly quotes on purpose.
    "RUF001", "RUF002", "RUF003",
]

[lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[lint.per-file-ignores]
# **Three files where a long line is DATA, not prose, and wrapping it would
# change behavior.** Measured 2026-08-17: 23 of 30 E501 hits were unwrappable for
# one of these reasons, so the exception is the finding rather than a shortcut.
#
# `build-diagram.py`   -- the output is one enormous f-string. Its base64 image
#                         payloads and XML template lines ARE the artifact.
# `claude-dirty-words.py` -- its own docstring quotes the words it bans, so most
#                         lines carry a trailing `DIRTY-WORDS-EXEMPT` marker that
#                         MUST stay on the line it exempts.
# `mutation-check.py`  -- every long line is a mutation ANCHOR: source text that
#                         must match the TypeScript byte for byte. Reflowing one
#                         silently turns its mutation into a SKIP, and this
#                         repository's own rule is that a SKIPPED mutation is a
#                         survivor.
"scripts/build-diagram.py" = ["E501"]
"scripts/claude-dirty-words.py" = ["E501"]
"scripts/mutation-check.py" = ["E501"]

# **PTH is NOT selected, and this is the note the ignore list points at.**
# It reported 154 findings across this repository and `~/.claude/hooks/` -- more
# than every other family combined -- and every fix is manual: `os.path.join` to
# `Path.__truediv__`, `open` to `Path.open`, and a str-to-Path type change that
# ripples through call sites. **`os.path` is not deprecated and these scripts
# work.** Migrating live file I/O in hooks that fail open, for zero behavior
# gain, is the definition of overkill. **New code SHOULD use `pathlib` anyway.**
